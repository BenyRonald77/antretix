worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  access_log off;
  sendfile on;
  keepalive_timeout 65;

  # Lapis pertama: rate limit kasar per IP, hanya untuk meredam banjir request mentah.
  # Batas yang sebenarnya (join 5/menit, status 30/menit, checkout 10/menit) ada di API (sliding window Redis).
  # Angkanya longgar karena k6 menembak dari satu IP; di produksi turunkan sesuai kapasitas.
  limit_req_zone $binary_remote_addr zone=perip:20m rate=2000r/s;
  limit_req_status 429;

  upstream api {
    least_conn;
    server api1:4000 max_fails=3 fail_timeout=5s;
    server api2:4000 max_fails=3 fail_timeout=5s;
    keepalive 512;
  }

  upstream web {
    server web:3000;
    keepalive 64;
  }

  server {
    listen 80;

    # SSE antrean: tanpa buffering dan dengan timeout panjang agar koneksi tidak diputus proxy.
    location ~ ^/api/events/[^/]+/queue/stream$ {
      limit_req zone=perip burst=10000 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/ {
      limit_req zone=perip burst=10000 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Aset statis Next.js aman di-cache lama (nama file sudah ber-hash).
    location /_next/static/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
