global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api1:4000", "api2:4000"]

  # Worker berjalan dengan beberapa replika; DNS "worker" mengembalikan semua IP-nya.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 10s
